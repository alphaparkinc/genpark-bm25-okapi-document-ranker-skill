[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-bm25-okapi-document-ranker-skill"
version = "1.0.0"
description = "Okapi BM25 information retrieval document scoring and search engine with document length normalization."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-bm25-okapi-document-ranker-skill"
Repository = "https://github.com/alphaparkinc/genpark-bm25-okapi-document-ranker-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-bm25-okapi-document-ranker-skill/issues"
